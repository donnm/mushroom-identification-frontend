# Local check of the production image. For the full stack (backend, database,
# reverse proxy) see the deploy/ directory in the project root.
services:
  web:
    build: .
    ports:
      - "5173:8080"
    environment:
      # Where the browser should send API calls. Point this at a backend you are
      # running on the host to test against real data.
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8080}
      # Where nginx forwards /api, /auth and /ws. Only used when VITE_API_URL
      # points back at this container's own origin.
      - BACKEND_ORIGIN=${BACKEND_ORIGIN:-http://backend:8080}
